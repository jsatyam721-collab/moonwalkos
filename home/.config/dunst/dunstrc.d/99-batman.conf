[global]
width = (320, 400)
offset = (24, 24)
padding = 16
horizontal_padding = 30
text_icon_padding = 14
frame_width = 2
gap_size = 8
corner_radius = 44
icon_corner_radius = 0
min_icon_size = 56
max_icon_size = 64
icon_position = left
font = JetBrainsMono Nerd Font 10
markup = full
format = "<span foreground='#ffd700' size='x-small' weight='bold' letter_spacing='2400' text_transform='uppercase'>▍%a</span>\n<span size='large' weight='bold'>%s</span>\n<span foreground='#a8a8a8'>%b</span>"
highlight = "#ffd700"
progress_bar_corner_radius = 0
progress_bar_frame_width = 0
progress_bar_height = 6

[urgency_low]
background = "#0a0a0aee"
foreground = "#e8e8e8"
frame_color = "#3a3a3a"
highlight = "#8a8a8a"
default_icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"
icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"
timeout = 5

[urgency_normal]
background = "#0a0a0af2"
foreground = "#e8e8e8"
frame_color = "#ffd700"
highlight = "#ffd700"
default_icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"
icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"
timeout = 6

[urgency_critical]
background = "#140405f5"
foreground = "#f2f2f2"
frame_color = "#c8102e"
highlight = "#c8102e"
default_icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"
icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"
format = "<span foreground='#ff3b4e' size='x-small' weight='bold' letter_spacing='2400' text_transform='uppercase'>▍Arkham alert · %a</span>\n<span size='large' weight='bold'>%s</span>\n<span foreground='#c9a5a8'>%b</span>"
timeout = 0

[batman_everywhere]
appname = ".*"
new_icon = "@HOME@/.local/share/icons/batman/batman-logo.svg"

[wezterm_not_critical]
appname = "^wezterm$"
urgency = normal
background = "#0a0a0af2"
foreground = "#e8e8e8"
frame_color = "#ffd700"
format = "<span foreground='#ffd700' size='x-small' weight='bold' letter_spacing='2400' text_transform='uppercase'>▍%a</span>\n<span size='large' weight='bold'>%s</span>\n<span foreground='#a8a8a8'>%b</span>"
timeout = 8
